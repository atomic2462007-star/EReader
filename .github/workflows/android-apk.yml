
name: Build Katana APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Capacitor
        run: npm install --no-save --package-lock=false @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Build game
        run: npx vite build --config vite.mobile.config.ts

      - name: Create Android project
        run: npx cap add android

      - name: Sync game
        run: npx cap sync android

      - name: Set landscape orientation
        run: node scripts/set-android-landscape.mjs

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Katana-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
