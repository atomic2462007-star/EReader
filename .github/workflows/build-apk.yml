name: Build Katana APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Locate project folder
        run: |
          F=$(find . -maxdepth 3 -name vite.mobile.config.ts | grep -v node_modules | head -n 1)
          if [ -z $F ]; then
            echo ::error::vite.mobile.config.ts not found. Upload ALL project files to the repository.
            exit 1
          fi
          echo APP_DIR=$(dirname $F) >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Install Capacitor
        working-directory: ${{ env.APP_DIR }}
        run: npm install --no-save --package-lock=false --no-audit --no-fund @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Build game
        working-directory: ${{ env.APP_DIR }}
        run: npm run build:mobile

      - name: Create Android project
        working-directory: ${{ env.APP_DIR }}
        run: npx cap add android

      - name: Sync game
        working-directory: ${{ env.APP_DIR }}
        run: npx cap sync android

      - name: Set landscape orientation
        working-directory: ${{ env.APP_DIR }}
        run: node scripts/set-android-landscape.mjs

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build APK
        working-directory: ${{ env.APP_DIR }}/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Katana-APK
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
