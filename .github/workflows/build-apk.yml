name: Build Katana APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: katana-project

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: katana-project/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Capacitor
        run: npm install --no-save --package-lock=false @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Build game
        run: npm run build:mobile

      - name: Create Android project
        run: npx cap add android

      - name: Sync game
        run: npx cap sync android

      - name: Set landscape orientation
        run: node scripts/set-android-landscape.mjs

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build APK
        working-directory: katana-project/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Katana-APK
          path: katana-project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
